<style>
:root{
  --maroon:#6b0f24; --maroon-d:#3f0613; --maroon-m:#8a1a33;
  --gold:#c49a3c; --gold-l:#f1d98f; --gold-d:#8f6a1e;
  --ivory:#fcf4e4; --rose:#f6e3dc; --ink:#4a1a22; --saffron:#e8892b;
  --serif:'Cormorant Garamond',Georgia,serif;
  --caps:'Cinzel',Georgia,serif;
  --script:'Pinyon Script','Snell Roundhand',cursive;
  --deva:'Tiro Devanagari Hindi','Noto Serif Devanagari',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--serif); color:var(--ink); overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%, #7d1730 0%, transparent 60%),
    radial-gradient(ellipse at 50% 100%, #2c040d 0%, transparent 70%),
    var(--maroon-d);
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}

/* ---------- falling petals ---------- */
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.petal{
  position:absolute;top:-30px;border-radius:60% 0 60% 0;opacity:.0;
  animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translate3d(0,-30px,0) rotate(0deg);opacity:0}
  10%{opacity:.75}
  50%{transform:translate3d(var(--sway),55vh,0) rotate(200deg)}
  90%{opacity:.6}
  100%{transform:translate3d(calc(var(--sway) * -.6),112vh,0) rotate(420deg);opacity:0}
}

/* ---------- intro / envelope ---------- */
.intro{
  position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:clamp(18px,4vh,34px);padding:20px;
  transition:opacity .9s ease, transform .9s ease;
}
.intro.gone{opacity:0;transform:scale(1.12);pointer-events:none}
.intro-top{text-align:center;color:var(--gold-l)}
.intro-top .deva{font-family:var(--deva);font-size:clamp(15px,3.6vw,19px);letter-spacing:.06em;color:var(--gold)}
.intro-top .to{font-family:var(--serif);font-style:italic;font-size:clamp(18px,4.4vw,22px);margin-top:10px;opacity:.9}

.env-wrap{perspective:1200px}
.envelope{
  position:relative;width:min(84vw,360px);aspect-ratio:3/2;cursor:pointer;
  filter:drop-shadow(0 22px 26px rgba(0,0,0,.45));
  animation:floaty 5s ease-in-out infinite;
  background:none;border:0;display:block;
}
@keyframes floaty{50%{transform:translateY(-7px)}}
.envelope.open{animation:none}
.env-back{position:absolute;inset:0;background:#5a0b1e;border-radius:6px}
.env-card{
  position:absolute;left:7%;right:7%;top:9%;bottom:9%;background:var(--ivory);border-radius:4px;
  display:flex;align-items:flex-start;justify-content:center;padding-top:9%;
  font-family:var(--script);font-size:clamp(22px,6vw,30px);color:var(--maroon);
  box-shadow:inset 0 0 0 5px var(--ivory), inset 0 0 0 6px var(--gold);
  transition:transform 1.1s cubic-bezier(.5,0,.2,1) .55s;z-index:2;
}
.envelope.open .env-card{transform:translateY(-62%)}
.env-front{
  position:absolute;inset:0;z-index:3;border-radius:6px;
  clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);
  background:
    linear-gradient(35deg, transparent 49.6%, rgba(241,217,143,.35) 50%, transparent 50.6%) 0 0/100% 100% no-repeat,
    linear-gradient(-35deg, transparent 49.6%, rgba(241,217,143,.35) 50%, transparent 50.6%) 0 0/100% 100% no-repeat,
    linear-gradient(160deg,#7d1730,#5a0b1e 70%);
}
.env-flap{
  position:absolute;left:0;right:0;top:0;height:54%;z-index:4;
  clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(180deg,#8a1a33,#6b0f24);
  transform-origin:top center;
  transition:transform .95s cubic-bezier(.5,0,.2,1), z-index 0s .45s;
}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
.seal{
  position:absolute;left:50%;top:54%;width:clamp(58px,17vw,72px);aspect-ratio:1;z-index:5;
  transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff1b8,var(--gold) 45%,var(--gold-d) 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,255,255,.18);
  display:grid;place-items:center;
  font-family:var(--script);font-size:clamp(20px,6vw,26px);color:var(--maroon-d);
  animation:pulse 2.4s ease-in-out infinite;
  transition:transform .45s ease, opacity .45s ease;
}
.seal::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed rgba(63,6,19,.55)}
@keyframes pulse{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 0 rgba(241,217,143,.55)}50%{box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 14px rgba(241,217,143,0)}}
.envelope.open .seal{transform:translate(-50%,-50%) scale(1.5);opacity:0;animation:none}
.tap-hint{font-family:var(--serif);font-style:italic;color:var(--gold-l);font-size:clamp(17px,4vw,20px);transition:opacity .4s}
.intro.opening .tap-hint{opacity:0}

/* ---------- book ---------- */
.bookwrap{
  position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
  opacity:0;pointer-events:none;
}
.bookwrap.show{opacity:1;pointer-events:auto;animation:bookIn 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes bookIn{from{opacity:0;transform:translateY(40px) scale(.94)}to{opacity:1;transform:none}}
.book{
  position:relative;width:min(100%,430px);height:min(calc(100dvh - 92px),780px);perspective:1800px;
}
.page{
  position:absolute;inset:0;border-radius:10px;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 0%,#fffaf0,transparent 70%),
    linear-gradient(180deg,var(--ivory),var(--rose));
  box-shadow:0 18px 40px rgba(0,0,0,.5), inset 0 0 0 1px rgba(196,154,60,.25);
  transform-origin:left center;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  transition:transform 1s cubic-bezier(.6,.05,.25,1), opacity 0s;
  z-index:calc(20 - var(--i));
  pointer-events:none;
}
.page.dark{
  background:
    radial-gradient(circle at 50% 38%,#8a1a33 0%,transparent 62%),
    linear-gradient(180deg,#5a0b1e,var(--maroon-d));
  color:var(--gold-l);
}
.page.active{pointer-events:auto}
.page.past{transform:rotateY(-115deg);opacity:0;transition:transform 1s cubic-bezier(.6,.05,.25,1), opacity .35s ease .65s}
.page::before{content:"";position:absolute;inset:10px;border:1px solid var(--gold);border-radius:4px;pointer-events:none;z-index:3}
.page::after{content:"";position:absolute;inset:15px;border:1px solid rgba(196,154,60,.4);border-radius:2px;pointer-events:none;z-index:3}
.corner{position:absolute;width:46px;height:46px;color:var(--gold);z-index:3;pointer-events:none}
.corner.tl{top:11px;left:11px}
.corner.tr{top:11px;right:11px;transform:scaleX(-1)}
.corner.bl{bottom:11px;left:11px;transform:scaleY(-1)}
.corner.br{bottom:11px;right:11px;transform:scale(-1)}
.inner{
  position:absolute;inset:0;padding:clamp(34px,6vh,52px) clamp(28px,8vw,40px);overflow-y:auto;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  scrollbar-width:none;
}
.inner::-webkit-scrollbar{display:none}
.inner > :first-child{margin-top:auto}
.inner > :last-child{margin-bottom:auto}

/* reveal inside active page */
.page.active .rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--d,0) * 1s + .45s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.ganesh.maroon{background:linear-gradient(180deg,var(--maroon-m),var(--maroon-d));width:clamp(64px,11vh,84px)}
.hostname{font-family:var(--script);font-size:clamp(34px,9.5vw,44px);color:var(--maroon);line-height:1.15}
.req{font-style:italic;font-size:clamp(17px,4.3vw,20px);line-height:1.35;max-width:26ch}
.person{font-family:var(--script);font-size:clamp(60px,18vw,88px);line-height:1;color:var(--maroon);padding:0 6px}
.fam{font-size:clamp(16px,4.1vw,18.5px);line-height:1.4;max-width:30ch;margin-top:4px;font-weight:500}
.with{font-family:var(--script);font-size:clamp(34px,9vw,42px);color:var(--gold-d);line-height:1}

.deva{font-family:var(--deva);color:var(--gold-d)}
.dark .deva{color:var(--gold)}
.caps{font-family:var(--caps);letter-spacing:.22em;font-size:12px;color:var(--gold-d);text-transform:uppercase}
.dark .caps{color:var(--gold)}
.script{font-family:var(--script);font-weight:400;color:var(--maroon)}
.lead{font-size:clamp(18px,4.6vw,21px);line-height:1.5;max-width:30ch}
.names{
  font-family:var(--script);font-size:clamp(54px,15vw,76px);line-height:1.02;
  background:linear-gradient(100deg,#b88a2e 0%,#fff0b0 30%,#c49a3c 55%,#fff0b0 80%,#b88a2e 100%);
  background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 6s linear infinite;padding:2px 6px;
}
@keyframes shimmer{to{background-position:-220% 0}}
.amp{font-family:var(--script);font-size:clamp(34px,9vw,46px);color:var(--gold-l);line-height:1}
.mandala{width:clamp(130px,26vh,190px);height:auto;color:var(--gold);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orn{width:120px;height:14px;color:var(--gold);margin:14px auto}
.gap{height:clamp(8px,2vh,18px)}
.sub{font-style:italic;font-size:clamp(17px,4.2vw,19px);opacity:.9}
.page-hint{font-style:italic;font-size:16px;color:var(--gold);margin-top:18px;animation:nudge 2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}

/* day pages */
.city{font-family:var(--caps);letter-spacing:.3em;font-size:12px;color:var(--gold-d)}
.bignum{font-family:var(--caps);font-weight:400;font-size:clamp(72px,19vw,100px);line-height:.95;color:var(--maroon);margin-top:8px}
.month{font-family:var(--serif);font-weight:500;font-size:clamp(20px,5vw,24px);letter-spacing:.12em;color:var(--maroon-m);margin-top:6px}
.dow{font-style:italic;font-size:18px;color:var(--gold-d)}
.events{width:100%;display:flex;flex-direction:column;gap:clamp(12px,2.4vh,20px)}
.ev .nm{font-family:var(--script);font-size:clamp(36px,10vw,46px);color:var(--maroon);line-height:1.1}
.ev .tm{display:inline-block;margin-top:2px;font-family:var(--caps);font-size:13px;letter-spacing:.18em;color:var(--ivory);
  background:var(--maroon);padding:5px 14px 4px;border-radius:99px}
.ev .bl{font-style:italic;font-size:clamp(16px,4vw,18px);margin:7px auto 0;max-width:28ch;line-height:1.35;opacity:.85}
.ev .cal{background:none;border:0;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--maroon-m);
  text-decoration:underline;text-underline-offset:3px;margin-top:4px;padding:6px}
.venue{margin-top:clamp(12px,2.4vh,20px);display:flex;flex-direction:column;align-items:center;gap:6px;max-width:30ch}
.venue svg{width:22px;height:22px;color:var(--maroon)}
.venue .ad{font-size:clamp(17px,4.3vw,19px);line-height:1.35;font-weight:500}
.btn{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--caps);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  padding:11px 20px 10px;border-radius:99px;text-decoration:none;border:1px solid var(--gold);color:var(--maroon);
  background:rgba(255,255,255,.4);transition:background .25s,color .25s;
}
.btn:hover{background:var(--maroon);color:var(--gold-l)}
.btn.solid{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--maroon-d);border-color:var(--gold-d);font-weight:600}
.btn.solid:hover{filter:brightness(1.07);background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--maroon-d)}

/* summary list */
.list{width:100%;margin-top:14px;text-align:left}
.row{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:9px 0;border-bottom:1px dotted rgba(196,154,60,.55);align-items:baseline}
.row:last-child{border-bottom:0}
.row .d{font-family:var(--caps);font-size:15px;color:var(--gold-l)}
.row .d small{display:block;font-size:10px;letter-spacing:.14em;color:var(--gold);opacity:.85}
.row .e{font-size:clamp(16px,4vw,18px);line-height:1.3}
.row .e b{font-weight:600;color:#fff4d1}
.row .e i{opacity:.8}

/* nav */
.nav{display:flex;align-items:center;gap:18px;color:var(--gold-l)}
.arrow{
  width:46px;height:46px;border-radius:50%;border:1px solid var(--gold);background:rgba(255,255,255,.06);
  display:grid;place-items:center;transition:background .25s,opacity .25s,transform .2s;
}
.arrow:hover{background:rgba(255,255,255,.16)}
.arrow:active{transform:scale(.92)}
.arrow[disabled]{opacity:.25;pointer-events:none}
.arrow svg{width:20px;height:20px}
.dots{display:flex;gap:7px;max-width:56vw;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%;border:1px solid var(--gold);background:transparent;padding:0;transition:all .3s}
.dot.on{background:var(--gold-l);width:22px;border-radius:6px}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important;animation-iteration-count:1 !important;transition-duration:.01s !important;transition-delay:0s !important}
  .petals{display:none}
}
</style>
</head>
<body>

<!-- ================= EDIT YOUR DETAILS HERE (see script at the bottom) ================= -->

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mandala" viewBox="-100 -100 200 200"></symbol>
    <symbol id="corner" viewBox="0 0 46 46">
      <g fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <path d="M3 44V16Q3 3 16 3H44"/>
        <path d="M10 44V22Q10 10 22 10H44" opacity=".6"/>
        <circle cx="3" cy="3" r="2" fill="currentColor" stroke="none"/>
        <path d="M16 16q4-8 12-2" opacity=".8"/>
      </g>
    </symbol>
    <symbol id="orn" viewBox="0 0 120 14">
      <g fill="none" stroke="currentColor" stroke-width="1">
        <path d="M2 7H46M74 7H118"/>
        <path d="M60 1L66 7L60 13L54 7Z" fill="currentColor"/>
        <circle cx="48" cy="7" r="1.6" fill="currentColor"/><circle cx="72" cy="7" r="1.6" fill="currentColor"/>
      </g>
    </symbol>
    <symbol id="pin" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/>
    </symbol>
  </defs>
</svg>

<div class="petals" id="petals" aria-hidden="true"></div>

<!-- Stage 1: envelope -->
<main class="intro" id="intro">
  <div class="intro-top">
    <div class="deva">॥ श्री गणेशाय नमः ॥<br>॥ जय श्री बालाजी महाराज ॥</div>
    <div class="to" id="introTo"></div>
  </div>
  <div class="env-wrap">
    <button class="envelope" id="envelope" aria-label="Open the invitation">
      <div class="env-back"></div>
      <div class="env-card" id="envCard"></div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal" id="seal"></div>
    </button>
  </div>
  <div class="tap-hint">Tap the seal to open</div>
</main>

<!-- Stage 2: the card -->
<section class="bookwrap" id="bookWrap" aria-live="polite">
  <div class="book" id="book"></div>
  <nav class="nav" aria-label="Page navigation">
    <button class="arrow" id="prev" aria-label="Previous page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" aria-label="Next page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </nav>
</section>

<script>
/* =====================================================================
   1. YOUR DETAILS — change anything in this block
   ===================================================================== */
const CONFIG = {
  bride: "Vaishnavi",
  groom: "Saksham",
  host: "Ms. Anjana Aggarwal",
  request: "Request your gracious presence at the marriage ceremony of her beloved son",
  groomLines: [
    "Grand S/o Ms. Vijaya Aggarwal &amp; Late Mr. Hazari Lal Aggarwal",
    "S/o Late Mr. Naveen Kumar Aggarwal"
  ],
  brideLines: [
    "Grand D/o Shri Rasiklal Shantilal Luniya &amp; Smt. Ranjana Rasiklal Luniya",
    "D/o Shri Mahendra Rasiklal Luniya &amp; Smt. Sharda Mahendra Luniya"
  ],
  closing: "We can't wait to celebrate with you.",
  hosts: "The Aggarwal &amp; Luniya Families",         // signed at the end
  rsvpPhone: "",                   // WhatsApp number WITH country code, digits only, e.g. "919876543210". Leave "" to hide the RSVP button.
  petals: true
};

/* Events, grouped by day. Times are 24h. */
const DAYS = [
  { date:"2026-12-02", city:"Dehradun",
    venue:"23, Devlok Colony, Shimla Road, Dehradun",
    events:[
      {name:"Haldi",  time:"10:00", note:"A golden morning of turmeric, music and blessings."},
      {name:"Mandha", time:"13:00", note:"An auspicious ritual to bless the days ahead."}
    ]},
  { date:"2026-12-03", city:"Pune",
    venue:"Club House, Naren Bliss Society, Magarpatta, Pune",
    events:[ {name:"Mehendi", time:"13:00", note:"Henna, laughter and song."} ]},
  { date:"2026-12-04", city:"Pune",
    venue:"Asodit Banquets, Magarpatta, Pune",
    events:[
      {name:"Kumkum",  time:"10:00", note:"A sacred morning of kumkum and blessings."},
      {name:"Sangeet", time:"18:00", note:"An evening of music, dance and celebration."}
    ]},
  { date:"2026-12-05", city:"Pune",
    venue:"Asodit Banquets, Magarpatta, Pune",
    events:[
      {name:"Ghurchari & Barat", time:"10:00", note:"The groom's joyous arrival, with music and dance."},
      {name:"Vidai",             time:"17:00", note:"A heartfelt farewell as a new chapter begins."}
    ]},
  { date:"2026-12-06", city:"Pune",
    venue:"Jairaj Sports Complex, Pune",
    events:[ {name:"Reception", time:"19:00", note:"An evening of dinner and good company, celebrating the newlyweds."} ]},
  { date:"2026-12-09", city:"Dehradun",
    venue:"23, Devlok Colony, Shimla Road, Dehradun",
    events:[ {name:"Katha", time:"16:00", note:"A prayer ceremony seeking blessings for the couple."} ]}
];

/* =====================================================================
   2. ENGINE — no need to edit below
   ===================================================================== */
const $ = s => document.querySelector(s);
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEK = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parse = d => { const [y,m,dd] = d.split("-").map(Number); return new Date(y, m-1, dd); };
const fmtTime = t => { let [h,m] = t.split(":").map(Number); const ap = h>=12?"PM":"AM"; h = h%12||12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };
const initials = `${CONFIG.groom[0]} & ${CONFIG.bride[0]}`;

/* mandala artwork */
(function(){
  let g = '<g fill="none" stroke="currentColor" stroke-width="1">';
  [96,90,44,22,6].forEach(r => g += `<circle r="${r}"/>`);
  for(let i=0;i<16;i++) g += `<ellipse cx="0" cy="-67" rx="9" ry="24" transform="rotate(${i*22.5})"/>`;
  for(let i=0;i<16;i++) g += `<ellipse cx="0" cy="-33" rx="5" ry="12" transform="rotate(${i*22.5+11.25})"/>`;
  for(let i=0;i<32;i++) g += `<circle cx="0" cy="-93" r="1.4" fill="currentColor" transform="rotate(${i*11.25})"/>`;
  g += '</g>';
  $("#mandala").innerHTML = g;
})();

/* petals */
if (CONFIG.petals) {
  const colors = ["#e8892b","#f2a93b","#d9531e","#f6c453","#c0392b"];
  const box = $("#petals");
  for (let i=0;i<20;i++){
    const p = document.createElement("i"); p.className = "petal";
    const s = 8 + Math.random()*10;
    Object.assign(p.style,{
      left: Math.random()*100+"%", width:s+"px", height:s*1.25+"px",
      background: colors[i%colors.length],
      animationDuration:(9+Math.random()*9)+"s", animationDelay:(-Math.random()*18)+"s"
    });
    p.style.setProperty("--sway",(Math.random()*120-60)+"px");
    box.appendChild(p);
  }
}

/* envelope text */
$("#introTo").textContent = CONFIG.guestLine;
$("#seal").textContent = initials;
$("#envCard").textContent = CONFIG.groom + " & " + CONFIG.bride;

/* calendar export */
function addToCalendar(day, ev){
  const d = parse(day.date), pad = n => String(n).padStart(2,"0");
  const [h,m] = ev.time.split(":").map(Number);
  const stamp = (hh) => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(hh)}${pad(m)}00`;
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Wedding Invite//EN","BEGIN:VEVENT",
    `UID:${Date.now()}-${ev.name.replace(/\W/g,"")}@wedding-invite`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z`,
    `DTSTART;TZID=Asia/Kolkata:${stamp(h)}`,
    `DTEND;TZID=Asia/Kolkata:${stamp(Math.min(h+2,23))}`,
    `SUMMARY:${ev.name} · ${CONFIG.groom} & ${CONFIG.bride}`,
    `LOCATION:${day.venue.replace(/,/g,"\\,")}`,
    `DESCRIPTION:${ev.note.replace(/,/g,"\\,")}`,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download = ev.name.replace(/\W+/g,"-").toLowerCase() + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
}

/* build pages */
const corners = '<svg class="corner tl"><use href="#corner"/></svg><svg class="corner tr"><use href="#corner"/></svg><svg class="corner bl"><use href="#corner"/></svg><svg class="corner br"><use href="#corner"/></svg>';
const orn = '<svg class="orn rise" style="--d:.3"><use href="#orn"/></svg>';
const pages = [];

// 1. cover
pages.push({dark:true, html:`
  <div class="deva rise" style="--d:0;font-size:18px;line-height:1.6">॥ श्री गणेशाय नमः ॥<br>॥ जय श्री बालाजी महाराज ॥</div>
  <div class="gap"></div>
  <div class="ganesh rise" style="--d:.15" role="img" aria-label="Lord Ganesha"></div>
  <div class="gap"></div>
  <div class="caps rise" style="--d:.3">The wedding of</div>
  <div class="names rise" style="--d:.4">${esc(CONFIG.groom)}</div>
  <div class="amp rise" style="--d:.5">&amp;</div>
  <div class="names rise" style="--d:.6">${esc(CONFIG.bride)}</div>
  <div class="gap"></div>
  <div class="caps rise" style="--d:.75">2 – 9 December 2026</div>
  <div class="sub rise" style="--d:.85;margin-top:6px">Dehradun &amp; Pune</div>
  <div class="page-hint rise" style="--d:1.1">Turn the page &rsaquo;</div>`});

// 2. groom's side
pages.push({html:`
  <div class="ganesh maroon rise" style="--d:0" role="img" aria-label="Lord Ganesha"></div>
  <div class="deva rise" style="--d:.1;font-size:17px;line-height:1.6;margin-top:8px">॥ श्री गणेशाय नमः ॥<br>॥ जय श्री बालाजी महाराज ॥</div>
  <div class="gap"></div>
  <div class="hostname rise" style="--d:.25">${esc(CONFIG.host)}</div>
  <p class="req rise" style="--d:.35">${esc(CONFIG.request)}</p>
  <div class="person rise" style="--d:.5">${esc(CONFIG.groom)}</div>
  ${CONFIG.groomLines.map((l,i)=>`<div class="fam rise" style="--d:${.6+i*.1}">${l}</div>`).join("")}`});

// 3. bride's side
pages.push({html:`
  <div class="with rise" style="--d:0">with</div>
  <div class="person rise" style="--d:.15;margin-top:6px">${esc(CONFIG.bride)}</div>
  ${CONFIG.brideLines.map((l,i)=>`<div class="fam rise" style="--d:${.3+i*.1}">${l}</div>`).join("")}
  ${orn}
  <div class="sub rise" style="--d:.7">Six days of celebration await.<br>Turn the page for each one.</div>`});

// 3+. one page per day
DAYS.forEach((day,di) => {
  const d = parse(day.date);
  const evs = day.events.map((ev,i) => `
    <div class="ev rise" style="--d:${.35+i*.18}">
      <div class="nm">${esc(ev.name)}</div>
      <div class="tm">${fmtTime(ev.time)}</div>
      <p class="bl">${esc(ev.note)}</p>
      <button class="cal" data-day="${di}" data-ev="${i}">Add to calendar</button>
    </div>`).join("");
  const q = encodeURIComponent(day.venue);
  pages.push({html:`
    <div class="city rise" style="--d:0">${esc(day.city.toUpperCase())}</div>
    <div class="bignum rise" style="--d:.1">${String(d.getDate()).padStart(2,"0")}</div>
    <div class="month rise" style="--d:.15">${MONTHS[d.getMonth()].toUpperCase()} ${d.getFullYear()}</div>
    <div class="dow rise" style="--d:.2">${WEEK[d.getDay()]}</div>
    ${orn}
    <div class="events">${evs}</div>
    <div class="venue rise" style="--d:${.4+day.events.length*.18}">
      <svg><use href="#pin"/></svg>
      <div class="ad">${esc(day.venue)}</div>
      <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Open in Maps</a>
    </div>`});
});

// last. summary + RSVP
const rows = DAYS.map(day => {
  const d = parse(day.date);
  return `<div class="row"><div class="d">${String(d.getDate()).padStart(2,"0")}<small>${MONTHS[d.getMonth()].slice(0,3).toUpperCase()} · ${WEEK[d.getDay()].slice(0,3).toUpperCase()}</small></div>
  <div class="e"><b>${day.events.map(e=>esc(e.name)).join(", ")}</b><br><i>${esc(day.city)}</i></div></div>`;
}).join("");
const rsvpMsg = encodeURIComponent(`Hello! We received the invitation for ${CONFIG.groom} & ${CONFIG.bride}'s wedding. `);
pages.push({dark:true, html:`
  <div class="caps rise" style="--d:0">Save the dates</div>
  <div class="list rise" style="--d:.15">${rows}</div>
  <div class="gap"></div>
  <div class="script rise" style="--d:.4;font-size:clamp(28px,8vw,36px);color:var(--gold-l)">${esc(CONFIG.closing)}</div>
  <div class="sub rise" style="--d:.5;margin-top:4px">With love, ${esc(CONFIG.hosts)}</div>
  ${CONFIG.rsvpPhone ? `<div class="rise" style="--d:.6;margin-top:16px"><a class="btn solid" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.rsvpPhone}?text=${rsvpMsg}">RSVP on WhatsApp</a></div>` : ""}`});

const book = $("#book"), dotsEl = $("#dots");
pages.forEach((p,i) => {
  const el = document.createElement("article");
  el.className = "page" + (p.dark ? " dark" : "");
  el.style.setProperty("--i", i);
  el.innerHTML = corners + `<div class="inner">${p.html}</div>`;
  book.appendChild(el);
  const dot = document.createElement("button");
  dot.className = "dot"; dot.setAttribute("aria-label","Go to page " + (i+1));
  dot.onclick = () => go(i);
  dotsEl.appendChild(dot);
});

const els = [...book.children], dots = [...dotsEl.children];
let cur = 0;
function go(n){
  cur = Math.max(0, Math.min(pages.length-1, n));
  els.forEach((el,i) => {
    el.classList.toggle("past", i < cur);
    el.classList.toggle("active", i === cur);
    if (i === cur) el.querySelector(".inner").scrollTop = 0;
  });
  dots.forEach((d,i) => d.classList.toggle("on", i === cur));
  $("#prev").disabled = cur === 0;
  $("#next").disabled = cur === pages.length-1;
}
$("#prev").onclick = () => go(cur-1);
$("#next").onclick = () => go(cur+1);
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(cur+1);
  if (e.key === "ArrowLeft") go(cur-1);
});
let sx = null;
book.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, {passive:true});
book.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
});
book.addEventListener("click", e => {
  const b = e.target.closest(".cal");
  if (b) { const day = DAYS[+b.dataset.day]; addToCalendar(day, day.events[+b.dataset.ev]); }
});

/* open the envelope */
const env = $("#envelope"), intro = $("#intro");
let opened = false;
function openInvite(){
  if (opened) return; opened = true;
  env.classList.add("open"); intro.classList.add("opening");
  setTimeout(() => { intro.classList.add("gone"); $("#bookWrap").classList.add("show"); go(0); }, 1900);
}
env.addEventListener("click", openInvite);
go(0);
els.forEach(el => el.classList.remove("active")); // keep cover animation until opened
</script>
</body>
</html>
