<style>
:root{
  --maroon:#5f6b47; --maroon-d:#3b4530; --maroon-m:#78855f;
  --gold:#cfae82; --gold-l:#f1dcc0; --gold-d:#9c7a4e;
  --ivory:#fbf5e9; --rose:#f3e6cf; --ink:#2e3822;
  --serif:'Cormorant Garamond',Georgia,serif;
  --caps:'Cinzel',Georgia,serif;
  --script:'Pinyon Script','Snell Roundhand',cursive;
  --deva:'Tiro Devanagari Hindi','Noto Serif Devanagari',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--serif);color:var(--ink);
  background:radial-gradient(ellipse at 50% 0%,#7d8a63 0%,transparent 60%),radial-gradient(ellipse at 50% 100%,#2b3322 0%,transparent 70%),var(--maroon-d);
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px}

/* ---------- petals ---------- */
.petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
.petal{position:absolute;top:-30px;border-radius:60% 0 60% 0;opacity:0;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translate3d(0,-30px,0) rotate(0);opacity:0}
  10%{opacity:.7}
  50%{transform:translate3d(var(--sway),55vh,0) rotate(200deg)}
  90%{opacity:.5}
  100%{transform:translate3d(calc(var(--sway) * -.6),112vh,0) rotate(420deg);opacity:0}
}

/* ---------- envelope intro ---------- */
.intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(18px,4vh,34px);padding:20px;transition:opacity .9s ease,transform .9s ease}
.intro.gone{opacity:0;transform:scale(1.12);pointer-events:none}
.intro-top{text-align:center;color:var(--gold-l)}
.intro-top .deva{font-family:var(--deva);font-size:clamp(15px,3.6vw,19px);letter-spacing:.06em;color:var(--gold);line-height:1.7}
.intro-top .to{font-style:italic;font-size:clamp(18px,4.4vw,22px);margin-top:10px;opacity:.9}
.env-wrap{perspective:1200px}
.envelope{position:relative;width:min(84vw,360px);aspect-ratio:3/2;cursor:pointer;filter:drop-shadow(0 22px 26px rgba(0,0,0,.45));
  animation:floaty 5s ease-in-out infinite;background:none;border:0;display:block}
@keyframes floaty{50%{transform:translateY(-7px)}}
.envelope.open{animation:none}
.env-back{position:absolute;inset:0;background:#454f36;border-radius:6px}
.env-card{position:absolute;left:7%;right:7%;top:9%;bottom:9%;background:var(--ivory);border-radius:4px;display:flex;align-items:flex-start;justify-content:center;
  padding-top:9%;font-family:var(--script);font-size:clamp(22px,6vw,30px);color:var(--maroon);
  box-shadow:inset 0 0 0 5px var(--ivory),inset 0 0 0 6px var(--gold);transition:transform 1.1s cubic-bezier(.5,0,.2,1) .55s;z-index:2}
.envelope.open .env-card{transform:translateY(-62%)}
.env-front{position:absolute;inset:0;z-index:3;border-radius:6px;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);
  background:linear-gradient(35deg,transparent 49.6%,rgba(241,220,192,.35) 50%,transparent 50.6%) 0 0/100% 100% no-repeat,
  linear-gradient(-35deg,transparent 49.6%,rgba(241,220,192,.35) 50%,transparent 50.6%) 0 0/100% 100% no-repeat,
  linear-gradient(160deg,#7d8a63,#454f36 70%)}
.env-flap{position:absolute;left:0;right:0;top:0;height:54%;z-index:4;clip-path:polygon(0 0,100% 0,50% 100%);
  background:linear-gradient(180deg,#78855f,#5f6b47);transform-origin:top center;transition:transform .95s cubic-bezier(.5,0,.2,1),z-index 0s .45s}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
.seal{position:absolute;left:50%;top:54%;width:clamp(58px,17vw,72px);aspect-ratio:1;z-index:5;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff0dc,var(--gold) 45%,var(--gold-d) 100%);
  box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.18);display:grid;place-items:center;
  font-family:var(--script);font-size:clamp(20px,6vw,26px);color:var(--maroon-d);animation:pulse 2.4s ease-in-out infinite;
  transition:transform .45s ease,opacity .45s ease}
.seal::before{content:"";position:absolute;inset:6px;border-radius:50%;border:1px dashed rgba(43,51,34,.55)}
@keyframes pulse{0%,100%{box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 0 rgba(241,220,192,.55)}50%{box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 14px rgba(241,220,192,0)}}
.envelope.open .seal{transform:translate(-50%,-50%) scale(1.5);opacity:0;animation:none}
.tap-hint{font-style:italic;color:var(--gold-l);font-size:clamp(17px,4vw,20px);transition:opacity .4s}
.intro.opening .tap-hint{opacity:0}

/* ---------- scroller ---------- */
.scroller{position:fixed;inset:0;z-index:10;overflow-y:auto;overflow-x:hidden;opacity:0;pointer-events:none;scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.scroller.show{opacity:1;pointer-events:auto;transition:opacity 1s ease}
.column{position:relative;max-width:480px;margin:0 auto;background:var(--maroon-d);box-shadow:0 0 60px rgba(0,0,0,.6)}
section{position:relative;overflow:hidden}

/* reveal on scroll */
.rise{opacity:0;transform:translateY(22px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--d,0) * 1s)}
.rise.in{opacity:1;transform:none}

/* top nav */
.topnav{position:fixed;top:0;left:50%;width:min(100%,480px);transform:translate(-50%,-110%);z-index:20;transition:transform .5s ease;
  background:rgba(38,46,30,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(207,174,130,.45);
  padding-top:env(safe-area-inset-top)}
.topnav.show{transform:translate(-50%,0)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--caps);font-size:11px;letter-spacing:.12em;padding:7px 13px 6px;border-radius:99px;border:1px solid rgba(207,174,130,.6);
  background:transparent;color:var(--gold-l);transition:all .3s}
.chip.on{background:var(--gold-l);color:var(--maroon-d);border-color:var(--gold-l)}
.prog{height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-l));width:0}

/* shared type */
.deva{font-family:var(--deva);color:var(--gold-d)}
.dark .deva{color:var(--gold)}
.caps{font-family:var(--caps);letter-spacing:.22em;font-size:12px;color:var(--gold-d);text-transform:uppercase}
.dark .caps{color:var(--gold)}
.sub{font-style:italic;font-size:clamp(17px,4.2vw,19px);opacity:.9}
.gap{height:clamp(10px,2.4vh,20px)}
.orn{width:120px;height:14px;color:var(--gold);margin:16px auto;display:block}
.center{display:flex;flex-direction:column;align-items:center;text-align:center}
.ganesh{width:clamp(96px,17vh,124px);aspect-ratio:214/275;flex:none;background:linear-gradient(180deg,var(--gold-l),var(--gold) 70%,#a3804f);

.ganesh.maroon{background:linear-gradient(180deg,var(--maroon-m),var(--maroon-d));width:clamp(70px,11vh,88px)}
.names{font-family:var(--script);font-size:clamp(56px,16vw,80px);line-height:1.02;
  background:linear-gradient(100deg,#a3804f 0%,#fff1dd 30%,#cfae82 55%,#fff1dd 80%,#a3804f 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 6s linear infinite;padding:2px 6px}
@keyframes shimmer{to{background-position:-220% 0}}
.amp{font-family:var(--script);font-size:clamp(34px,9vw,46px);color:var(--gold-l);line-height:1}

/* cover */
.cover{min-height:100dvh;background:radial-gradient(circle at 50% 40%,#78855f 0%,transparent 62%),linear-gradient(180deg,#454f36,var(--maroon-d));
  color:var(--gold-l);justify-content:center;padding:44px 28px 90px}
.cover .mandala{position:absolute;left:50%;top:44%;width:150%;max-width:760px;transform:translate(-50%,-50%);color:var(--gold);opacity:.12;animation:spin 140s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.cover > *:not(.mandala){position:relative}
.cue{position:absolute !important;bottom:26px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-style:italic;color:var(--gold);font-size:17px}
.cue svg{width:22px;height:22px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}

/* invitation */
.invite{background:radial-gradient(ellipse at 50% 0%,#fffaf0,transparent 70%),linear-gradient(180deg,var(--ivory),var(--rose));padding:64px 30px 70px}
.invite::before{content:"";position:absolute;inset:12px;border:1px solid var(--gold);pointer-events:none}
.invite::after{content:"";position:absolute;inset:17px;border:1px solid rgba(207,174,130,.4);pointer-events:none}
.hostname{font-family:var(--script);font-size:clamp(36px,10vw,46px);color:var(--maroon);line-height:1.15}
.req{font-style:italic;font-size:clamp(18px,4.4vw,20px);line-height:1.4;max-width:26ch;margin-top:4px}
.person{font-family:var(--script);font-size:clamp(66px,19vw,92px);line-height:1;color:var(--maroon);padding:0 6px;margin-top:6px}
.fam{font-size:clamp(17px,4.2vw,19px);line-height:1.4;max-width:29ch;margin-top:5px;font-weight:500}
.with{font-family:var(--script);font-size:clamp(38px,10vw,48px);color:var(--gold-d);line-height:1;margin:22px 0 4px}

/* city interludes (real photos) */
.city-intro{min-height:74dvh;justify-content:center;color:#fff7e8}
.city-intro .photo{position:absolute;inset:0;background-size:cover;background-position:center;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.1)}}
.city-intro .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(43,51,34,.82) 0%,rgba(43,51,34,.38) 45%,rgba(43,51,34,.86) 100%)}
.ci-in{position:relative;z-index:2;padding:0 24px}
.city-intro .caps{color:var(--gold-l)}
.cityname{font-family:var(--script);font-size:clamp(64px,18.5vw,96px);line-height:1;margin:8px 0 6px;color:#fff7e8;text-shadow:0 2px 24px rgba(0,0,0,.45)}
.city-intro .when{font-family:var(--caps);font-size:13px;letter-spacing:.2em;margin-top:14px;color:var(--gold-l)}

/* day sections + functional themes */
.day{padding:70px 26px 250px;color:var(--tx);background:linear-gradient(180deg,var(--t1),var(--t2))}
.day-in{position:relative;z-index:2}
.city{font-family:var(--caps);letter-spacing:.3em;font-size:12px;color:var(--ac);opacity:.85;margin-top:8px}
.bignum{font-family:var(--caps);font-weight:400;font-size:clamp(78px,21vw,108px);line-height:.95;color:var(--ac);margin-top:6px}
.month{font-weight:500;font-size:clamp(20px,5vw,24px);letter-spacing:.14em;margin-top:6px}
.dow{font-style:italic;font-size:19px;opacity:.85}
.events{width:100%;display:flex;flex-direction:column;align-items:center;margin-top:6px}
.ev{margin-top:20px}
.ev + .ev{padding-top:22px;position:relative}
.ev + .ev::before{content:"";position:absolute;top:0;left:50%;width:70px;height:1px;background:var(--line);transform:translateX(-50%)}
.ev .nm{font-family:var(--script);font-size:clamp(42px,12vw,56px);color:var(--ac);line-height:1.1}
.ev .tm{display:inline-block;margin-top:2px;font-family:var(--caps);font-size:13px;letter-spacing:.18em;background:var(--pbg);color:var(--ptx);padding:6px 16px 5px;border-radius:99px}
.ev .bl{font-style:italic;font-size:clamp(17px,4.2vw,19px);margin:9px auto 0;max-width:27ch;line-height:1.38;opacity:.92}
.ev .cal{background:none;border:0;font-style:italic;font-size:16px;color:var(--ac);text-decoration:underline;text-underline-offset:3px;margin-top:4px;padding:8px}
.venue{margin-top:28px;display:flex;flex-direction:column;align-items:center;gap:8px;max-width:30ch}
.venue svg{width:24px;height:24px;color:var(--ac)}
.venue .ad{font-size:clamp(18px,4.4vw,20px);line-height:1.35;font-weight:500}
.btn{display:inline-flex;align-items:center;font-family:var(--caps);font-size:12px;letter-spacing:.16em;text-transform:uppercase;padding:12px 22px 11px;border-radius:99px;
  text-decoration:none;border:1px solid var(--line);color:var(--ac);background:rgba(255,255,255,.18);transition:background .25s,color .25s}
.btn:hover{background:var(--ac);color:var(--t1)}
.btn.solid{background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--maroon-d);border-color:var(--gold-d);font-weight:600}
.btn.solid:hover{filter:brightness(1.07);background:linear-gradient(180deg,var(--gold-l),var(--gold));color:var(--maroon-d)}
.motif{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--ac);margin-bottom:6px}
.motif svg{width:20px;height:20px;opacity:.85}
.motif svg:nth-child(3){width:30px;height:30px;opacity:1}
.motif::before,.motif::after{content:"";width:40px;height:1px;background:var(--line)}

.th-haldi{--t1:#fcf5e6;--t2:#f1dcc0;--tx:#2e3822;--ac:#5f6b47;--line:#cfae82;--pbg:#4b5738;--ptx:#fbf0dc}
.th-mehendi{--t1:#eaefdc;--t2:#b9c59b;--tx:#2e3822;--ac:#5f6b47;--line:#a88c64;--pbg:#4b5738;--ptx:#fbf0dc}
.th-sangeet{--t1:#7d8a63;--t2:#3b4530;--tx:#fbf0dc;--ac:#f1dcc0;--line:#d4b78d;--pbg:#e6c9a0;--ptx:#3b4530}
.th-barat{--t1:#5f6b47;--t2:#343d28;--tx:#f6e8d0;--ac:#f1dcc0;--line:#cfae82;--pbg:#f1dcc0;--ptx:#3b4530}
.th-night{--t1:#424d33;--t2:#252c1c;--tx:#f1f3e6;--ac:#e6cba3;--line:#b39266;--pbg:#e6cba3;--ptx:#3b4530}
.th-katha{--t1:#fdf7ea;--t2:#ecd8b6;--tx:#2e3822;--ac:#5f6b47;--line:#cfae82;--pbg:#5f6b47;--ptx:#fdf7ea}
.sparkles i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite;z-index:1}
@keyframes tw{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.95;transform:scale(1.3)}}

/* closing */
.closing{background:radial-gradient(circle at 50% 20%,#78855f 0%,transparent 60%),linear-gradient(180deg,#454f36,var(--maroon-d));color:var(--gold-l);padding:70px 30px 80px}
.list{width:100%;margin-top:18px;text-align:left}
.row{display:grid;grid-template-columns:68px 1fr;gap:14px;padding:11px 0;border-bottom:1px dotted rgba(207,174,130,.55);align-items:baseline}
.row:last-child{border-bottom:0}
.row .d{font-family:var(--caps);font-size:17px;color:var(--gold-l)}
.row .d small{display:block;font-size:10px;letter-spacing:.14em;color:var(--gold);opacity:.85}
.row .e{font-size:clamp(17px,4.2vw,19px);line-height:1.3}
.row .e b{font-weight:600;color:#fff6e6}
.row .e i{opacity:.8}
.closing .script{font-family:var(--script);font-size:clamp(32px,9vw,42px);color:var(--gold-l);line-height:1.2}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01s !important;animation-iteration-count:1 !important;transition-duration:.01s !important;transition-delay:0s !important}
  .petals{display:none}.scroller{scroll-behavior:auto}
}
</style>
</head>

      {name:"Vidai",             time:"17:00", note:"A heartfelt farewell as a new chapter begins."}
    ]},
  { date:"2026-12-06", city:"Pune", photo:"skyline", pos:"center 25%", theme:"night", motif:"star",
    venue:"Jairaj Sports Complex, Pune",
    events:[ {name:"Reception", time:"19:00", note:"An evening of dinner and good company, celebrating the newlyweds."} ]},
  { date:"2026-12-09", city:"Dehradun", photo:"peaks", pos:"center 80%", introPhoto:"valley", introPos:"75% 60%", theme:"katha", motif:"marigold",
    intro:"Back home for a prayer of blessings",
    venue:"23, Devlok Colony, Shimla Road, Dehradun",
    events:[ {name:"Katha", time:"16:00", note:"A prayer ceremony seeking blessings for the couple."} ]}
];

/* =====================================================================
   2. ENGINE — no need to edit below
   ===================================================================== */
const $ = s => document.querySelector(s);
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEK = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parse = d => { const [y,m,dd] = d.split("-").map(Number); return new Date(y, m-1, dd); };
const fmtTime = t => { let [h,m] = t.split(":").map(Number); const ap = h>=12?"PM":"AM"; h = h%12||12; return `${h}:${String(m).padStart(2,"0")} ${ap}`; };
const rnd = (a,b) => a + Math.random()*(b-a);

/* mandala artwork */
(function(){
  let g = '<g fill="none" stroke="currentColor" stroke-width=".8">';
  [96,90,44,22,6].forEach(r => g += `<circle r="${r}"/>`);
  for(let i=0;i<16;i++) g += `<ellipse cx="0" cy="-67" rx="9" ry="24" transform="rotate(${i*22.5})"/>`;
  for(let i=0;i<16;i++) g += `<ellipse cx="0" cy="-33" rx="5" ry="12" transform="rotate(${i*22.5+11.25})"/>`;
  for(let i=0;i<32;i++) g += `<circle cx="0" cy="-93" r="1.4" fill="currentColor" transform="rotate(${i*11.25})"/>`;
  $("#mandala").innerHTML = g + '</g>';
})();

/* petals */
if (CONFIG.petals) {
  const colors = ["#d9c29a","#e8d5b0","#a9b48a","#c8b88a","#8f9c70"], box = $("#petals");
  for (let i=0;i<14;i++){
    const p = document.createElement("i"); p.className = "petal"; const s = rnd(8,17);
    Object.assign(p.style,{left:rnd(0,100)+"%",width:s+"px",height:s*1.25+"px",background:colors[i%colors.length],
      animationDuration:rnd(10,18)+"s",animationDelay:-rnd(0,18)+"s"});
    p.style.setProperty("--sway",rnd(-60,60)+"px"); box.appendChild(p);
  }
}

/* envelope text */
$("#introTo").textContent = CONFIG.guestLine;
$("#seal").textContent = `${CONFIG.groom[0]} & ${CONFIG.bride[0]}`;
$("#envCard").textContent = `${CONFIG.groom} & ${CONFIG.bride}`;


/* ---------- helpers ---------- */
function addToCalendar(day, ev){
  const d = parse(day.date), pad = n => String(n).padStart(2,"0");
  const [h,m] = ev.time.split(":").map(Number);
  const stamp = hh => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(hh)}${pad(m)}00`;
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Wedding Invite//EN","BEGIN:VEVENT",
    `UID:${Date.now()}-${ev.name.replace(/\W/g,"")}@wedding-invite`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").split(".")[0]}Z`,
    `DTSTART;TZID=Asia/Kolkata:${stamp(h)}`,`DTEND;TZID=Asia/Kolkata:${stamp(Math.min(h+2,23))}`,
    `SUMMARY:${ev.name} · ${CONFIG.groom} & ${CONFIG.bride}`,
    `LOCATION:${day.venue.replace(/,/g,"\\,")}`,`DESCRIPTION:${ev.note.replace(/,/g,"\\,")}`,
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));
  a.download = ev.name.replace(/\W+/g,"-").toLowerCase()+".ics";
  document.body.appendChild(a); a.click(); a.remove();
}
const orn = '<svg class="orn rise"><use href="#orn"/></svg>';
const motifRow = id => `<div class="motif rise">${('<svg><use href="#m-'+id+'"/></svg>').repeat(5)}</div>`;
const rangeText = group => {
  const a = parse(group[0].date), b = parse(group[group.length-1].date);
  return group.length === 1 ? `${a.getDate()} ${MONTHS[a.getMonth()]} ${a.getFullYear()}` : `${a.getDate()} – ${b.getDate()} ${MONTHS[b.getMonth()]} ${a.getFullYear()}`;
};

/* ---------- build the scroll ---------- */
const col = $("#column");
const add = html => { const t = document.createElement("div"); t.innerHTML = html.trim(); const el = t.firstChild; col.appendChild(el); return el; };

// cover
add(`<section class="cover dark center" id="top">
  <svg class="mandala" viewBox="-100 -100 200 200"><use href="#mandala"/></svg>
  <div class="deva rise" style="font-size:18px;line-height:1.7">॥ श्री गणेशाय नमः ॥<br>॥ जय श्री बालाजी महाराज ॥</div>
  <div class="gap"></div>
  <div class="ganesh rise" style="--d:.15" role="img" aria-label="Lord Ganesha"></div>
  <div class="gap"></div>
  <div class="caps rise" style="--d:.3">The wedding of</div>
  <div class="names rise" style="--d:.4">${esc(CONFIG.groom)}</div>
  <div class="amp rise" style="--d:.5">&amp;</div>
  <div class="names rise" style="--d:.6">${esc(CONFIG.bride)}</div>
  <div class="gap"></div>
  <div class="caps rise" style="--d:.75">2 – 9 December 2026</div>
  <div class="sub rise" style="--d:.85;margin-top:6px">Dehradun &amp; Pune</div>
  <div class="cue rise" style="--d:1.2">Scroll<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></div>
</section>`);

// invitation
add(`<section class="invite center">
  <div class="ganesh maroon rise" role="img" aria-label="Lord Ganesha"></div>
  <div class="deva rise" style="font-size:17px;line-height:1.7;margin-top:8px">॥ श्री गणेशाय नमः ॥<br>॥ जय श्री बालाजी महाराज ॥</div>
  ${orn}
  <div class="hostname rise">${esc(CONFIG.host)}</div>
  <p class="req rise">${esc(CONFIG.request)}</p>
  <div class="person rise">${esc(CONFIG.groom)}</div>
  ${CONFIG.groomLines.map(l=>`<div class="fam rise">${l}</div>`).join("")}
  <div class="with rise">with</div>
  <div class="person rise">${esc(CONFIG.bride)}</div>
  ${CONFIG.brideLines.map(l=>`<div class="fam rise">${l}</div>`).join("")}
  ${orn}
  <div class="sub rise">Six days of celebration await.<br>Scroll to see each one.</div>
</section>`);

// days, with a city interlude whenever the city changes
let prevCity = null;
DAYS.forEach((day,di) => {
  if (day.city !== prevCity) {
    const group = []; for (let j=di; j<DAYS.length && DAYS[j].city===day.city; j++) group.push(DAYS[j]);
    add(`<section class="city-intro center">
      <div class="photo ph-${day.introPhoto}" style="background-position:${day.introPos || 'center'}"></div><div class="shade"></div>
      <div class="ci-in center">
        <div class="caps rise">${esc(day.intro || "")}</div>
        <h2 class="cityname rise" style="--d:.12">${esc(day.city)}</h2>
        <div class="when rise" style="--d:.24">${rangeText(group)}</div>
      </div>
    </section>`);
    prevCity = day.city;
  }
  const d = parse(day.date);
  const evs = day.events.map((ev,i) => `<div class="ev rise" style="--d:${.1+i*.12}">
      <div class="nm">${esc(ev.name)}</div>
      <div class="tm">${fmtTime(ev.time)}</div>
      <p class="bl">${esc(ev.note)}</p>
      <button class="cal" data-day="${di}" data-ev="${i}">Add to calendar</button></div>`).join("");
  const q = encodeURIComponent(day.venue);
  const el = add(`<section class="day th-${day.theme} center" id="day-${di}" data-i="${di}">
    <div class="day-in center">
      ${motifRow(day.motif)}
      <div class="city rise">${esc(day.city.toUpperCase())}</div>
      <div class="bignum rise" style="--d:.05">${String(d.getDate()).padStart(2,"0")}</div>
      <div class="month rise" style="--d:.1">${MONTHS[d.getMonth()].toUpperCase()} ${d.getFullYear()}</div>
      <div class="dow rise" style="--d:.12">${WEEK[d.getDay()]}</div>
      <div class="events">${evs}</div>
      <div class="venue rise">
        <svg><use href="#pin"/></svg>
        <div class="ad">${esc(day.venue)}</div>
        <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Open in Maps</a>
      </div>
    </div>
    <div class="day-photo ph-${day.photo}" style="background-position:${day.pos || 'center'}"></div>
  </section>`);
  if (day.theme === "night" || day.theme === "sangeet") {
    const sp = document.createElement("div"); sp.className = "sparkles"; sp.setAttribute("aria-hidden","true");
    for (let i=0;i<26;i++){ const s = document.createElement("i");
      s.style.cssText = `left:${rnd(2,98)}%;top:${rnd(1,60)}%;animation-delay:${-rnd(0,3)}s;animation-duration:${rnd(2,4.5)}s`; sp.appendChild(s); }
    el.appendChild(sp);
  }
  prevCity = day.city;
});

// closing
const rows = DAYS.map(day => {
  const d = parse(day.date);
  return `<div class="row"><div class="d">${String(d.getDate()).padStart(2,"0")}<small>${MONTHS[d.getMonth()].slice(0,3).toUpperCase()} · ${WEEK[d.getDay()].slice(0,3).toUpperCase()}</small></div>
  <div class="e"><b>${day.events.map(e=>esc(e.name)).join(", ")}</b><br><i>${esc(day.city)}</i></div></div>`;
}).join("");
const rsvpMsg = encodeURIComponent(`Hello! We received the invitation for ${CONFIG.groom} & ${CONFIG.bride}'s wedding. `);
add(`<section class="closing dark center">
  <div class="ganesh rise" role="img" aria-label="Lord Ganesha" style="width:88px"></div>
  <div class="caps rise" style="margin-top:18px">Save the dates</div>
  <div class="list rise">${rows}</div>
  <div class="gap"></div>${orn}
  <div class="script rise">${esc(CONFIG.closing)}</div>
  <div class="sub rise" style="margin-top:8px">With love, ${CONFIG.hosts}</div>
  ${CONFIG.rsvpPhone ? `<div class="rise" style="margin-top:22px"><a class="btn solid" target="_blank" rel="noopener" href="https://wa.me/${CONFIG.rsvpPhone}?text=${rsvpMsg}">RSVP on WhatsApp</a></div>` : ""}
</section>`);

/* ---------- date chips ---------- */
const scroller = $("#scroller"), topnav = $("#topnav"), chipsEl = $("#chips"), prog = $("#prog");
DAYS.forEach((day,i) => {
  const d = parse(day.date), b = document.createElement("button");
  b.className = "chip"; b.textContent = `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;
  b.setAttribute("aria-label", `Jump to ${day.events.map(e=>e.name).join(" and ")}`);
  b.onclick = () => document.getElementById("day-"+i).scrollIntoView({block:"start"});
  chipsEl.appendChild(b);
});
const chips = [...chipsEl.children];
function setActive(i){
  chips.forEach((c,k) => c.classList.toggle("on", k===i));
  const c = chips[i]; if (c) chipsEl.scrollTo({left: c.offsetLeft - (chipsEl.clientWidth - c.clientWidth)/2, behavior:"smooth"});
}
scroller.addEventListener("scroll", () => {
  const max = scroller.scrollHeight - scroller.clientHeight;
  prog.style.width = (max > 0 ? scroller.scrollTop / max * 100 : 0) + "%";
  topnav.classList.toggle("show", scroller.scrollTop > window.innerHeight * .6);
}, {passive:true});
col.addEventListener("click", e => {
  const b = e.target.closest(".cal");
  if (b) { const day = DAYS[+b.dataset.day]; addToCalendar(day, day.events[+b.dataset.ev]); }
});

/* ---------- open the envelope, then start scroll effects ---------- */
function startObservers(){
  const reveal = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("in"); reveal.unobserve(e.target); } }),
    {root:scroller, threshold:.12, rootMargin:"0px 0px -6% 0px"});
  col.querySelectorAll(".rise").forEach(el => reveal.observe(el));
  const act = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) setActive(+e.target.dataset.i); }),
    {root:scroller, rootMargin:"-35% 0px -60% 0px"});
  col.querySelectorAll(".day").forEach(el => act.observe(el));
}
const env = $("#envelope"), intro = $("#intro"); let opened = false;
env.addEventListener("click", () => {
  if (opened) return; opened = true;
  env.classList.add("open"); intro.classList.add("opening");
  setTimeout(() => { intro.classList.add("gone"); scroller.classList.add("show"); startObservers(); scroller.focus?.(); }, 1900);
});
</script>
</body>
</html>
